from flask import Blueprint, request, render_template, redirect, session, flash
import hashlib
import sqlite3
import os

bp = Blueprint('auth', __name__)

DB = 'users.db'

def init_db():
    if not os.path.exists(DB):
        with sqlite3.connect(DB) as conn:
            conn.execute('CREATE TABLE users (user TEXT PRIMARY KEY, pwd TEXT)')

def hash_pass(p):
    return hashlib.sha256(p.encode()).hexdigest()

def is_logged_in():
    return 'user' in session

@bp.before_app_request
def setup_db():
    init_db() 

@bp.route('/')
def index():
    if is_logged_in():
        return redirect('/profile')
    return redirect('/login')

@bp.route('/register', methods=['GET', 'POST'])
def register():
    if is_logged_in():
        return redirect('/profile')
    if request.method == 'POST':
        u, p = request.form.get('u'), request.form.get('p')
        if u and p:
            try:
                with sqlite3.connect(DB) as conn:
                    conn.execute('INSERT INTO users VALUES (?, ?)', (u, hash_pass(p)))
                flash('Регистрация успешна!')
                return redirect('/login')
            except sqlite3.IntegrityError:
                flash('Пользователь уже существует')
    return render_template('register.html')

@bp.route('/login', methods=['GET', 'POST'])
def login():
    if is_logged_in():
        return redirect('/profile')
    if request.method == 'POST':
        u, p = request.form.get('u'), request.form.get('p')
        with sqlite3.connect(DB) as conn:
            cur = conn.cursor()
            cur.execute('SELECT pwd FROM users WHERE user=?', (u,))
            row = cur.fetchone()
        if row and row[0] == hash_pass(p):
            session['user'] = u
            return redirect('/profile')
        flash('Неверный логин или пароль')
    return render_template('login.html')

@bp.route('/logout')
def logout():
    session.pop('user', None)
    flash('Вы вышли из аккаунта')
    return redirect('/login')

@bp.route('/profile')
def profile():
    if not is_logged_in():
        return redirect('/login')
    return render_template('profile.html', username=session['user'])

from django.shortcuts import render, redirect, get_object_or_404
from .models import Task
from .forms import TaskForm

def task_list(request):
    if request.method == 'POST':
        form = TaskForm(request.POST)
        if form.is_valid():
            form.save()
            return redirect('task_list')
    tasks = Task.objects.all()
    form = TaskForm()
    return render(request, 'tasks/list.html', {'tasks': tasks, 'form': form})

def task_toggle_done(request, pk):
    task = get_object_or_404(Task, pk=pk)
    task.done = not task.done
    task.save()
    return redirect('task_list')

def task_edit(request, pk):
    task = get_object_or_404(Task, pk=pk)
    if request.method == 'POST':
        form = TaskForm(request.POST, instance=task)
        if form.is_valid():
            form.save()
            return redirect('task_list')
    else:
        form = TaskForm(instance=task)
    return render(request, 'tasks/edit.html', {'form': form})

def task_delete(request, pk):
    task = get_object_or_404(Task, pk=pk)
    task.delete()
    return redirect('task_list')

import React, { useState } from 'react';
import countries from './countries';

export default function App() {
  const [query, setQuery] = useState('');
  const filtered = query.trim()
    ? countries.filter(c => c.name.toLowerCase().includes(query.toLowerCase()))
    : countries;

  return (
    <div style={{ padding: '20px' }}>
      <h1 style={center}>Флаги стран</h1>
      <input
        placeholder="Поиск по названию..."
        value={query}
        onChange={e => setQuery(e.target.value)}
        style={inputStyle}
      />
      <div style={gridStyle}>
        {filtered.map((c, i) => (
          <div key={i} style={cardStyle}>
            <img src={c.flag} alt={c.name} style={imgStyle} />
            <div style={nameStyle}>{c.name}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

const center = { textAlign: 'center' };
const inputStyle = {
  display: 'block', margin: '0 auto 20px auto', padding: '10px',
  fontSize: '16px', width: '300px'
};
const gridStyle = { display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: '15px' };
const cardStyle = {
  border: '1px solid #ddd', borderRadius: '8px', overflow: 'hidden',
  textAlign: 'center', backgroundColor: '#f9f9f9'
};

import { ref, onMounted, onUnmounted } from 'vue'

const time = ref(0) // в секундах
const isRunning = ref(false)
let intervalId = null

function start() {
  if (isRunning.value) return
  isRunning.value = true
  intervalId = setInterval(() => {
    time.value++
  }, 1000)
}

function pause() {
  isRunning.value = false
  if (intervalId) {
    clearInterval(intervalId)
    intervalId = null
  }
}

function reset() {
  pause()
  time.value = 0
}

function formatTime(seconds) {
  const mins = Math.floor(seconds / 60).toString().padStart(2, '0')
  const secs = (seconds % 60).toString().padStart(2, '0')
  return {mins}:{secs}
}

products/views.py
Содержит представление (ProductListView) — оно обрабатывает HTTP-запрос и возвращает данные. Это «движок» API.

products/serializers.py
Преобразует объекты Python (Product) в JSON-совместимый формат. Без него DRF не знает, как отдавать данные.

products/models.py
Определяет структуру данных (товары). API возвращает именно эти данные — значит, модель — часть логики API.

products/urls.py
Привязывает путь /api/products/ к нужному представлению. Без этого — запрос не попадёт в API.

myshop/urls.py (частично)
Подключает products/urls.py к основному маршруту. Только так Django «знает», что /api/products/ существует.


Файлы, которые НЕ являются частью API (в рамках ТЗ):

products/admin.py
Нужен только для удобства управления данными через админку. API работает полностью без него. Он относится к административному интерфейсу, а не к программному (API).

manage.py
Служебный файл Django для команд (runserver, migrate и т.д.). Не участвует в обработке запросов.

myshop/wsgi.py, myshop/asgi.py
Файлы для развёртывания сервера (в продакшене). Не влияют на логику API.

myshop/__init__.py, products/__init__.py
Пустые файлы, просто помечают папки как Python-пакеты.

  <p id="result-cdn">CDN: ожидание...</p>
  <p id="result-local">Локально: ожидание...</p>

  <!-- Подключаем оба скрипта с async, чтобы не блокировать -->
  !script async src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js" id="cdn-script">!/script>
  !script async src="js/lodash.min.js" id="local-script">!/script>

  !script>
    function measureLoadTime(scriptId, elementId) {
      // Ждём, пока скрипт загрузится
      document.getElementById(scriptId).addEventListener('load', () => {
        // Получаем метрику загрузки по URL
        const url = document.getElementById(scriptId).src;
        const entry = performance.getEntriesByName(url)[0];
        if (entry) {
          const duration = entry.duration.toFixed(2);
          document.getElementById(elementId).textContent = 
            {scriptId === 'cdn-script' ? 'CDN' : 'Локально'}: загружено за {duration} мс;
        }
      });
    }

    // Запускаем измерение для обоих скриптов
    measureLoadTime('cdn-script', 'result-cdn');
    measureLoadTime('local-script', 'result-local');

from flask import Flask, render_template, request, redirect, url_for
import sqlite3

app = Flask(__name__)

 
def init_db():
    with sqlite3.connect('database.db') as conn:
        conn.execute('CREATE TABLE IF NOT EXISTS items (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT NOT NULL)')
        if conn.execute('SELECT COUNT(*) FROM items').fetchone()[0] == 0:
            conn.execute("INSERT INTO items (name) VALUES (?)", ('Первый элемент',))
            conn.execute("INSERT INTO items (name) VALUES (?)", ('Второй элемент',))

@app.route('/', methods=['GET', 'POST'])
def index():
    if request.method == 'POST':
        name = request.form['name']
        if name:
            with sqlite3.connect('database.db') as conn:
                conn.execute('INSERT INTO items (name) VALUES (?)', (name,))
        return redirect(url_for('index'))

    # Получаем все элементы из БД
    with sqlite3.connect('database.db') as conn:
        cursor = conn.execute('SELECT id, name FROM items')
        items = cursor.fetchall()

    return render_template('index.html', items=items)

if __name__ == '__main__':
    init_db()
    app.run(debug=True)

body {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  height: 100vh;
  background-color: #f0f0f0;
  font-family: Arial, sans-serif;
  gap: 50px;
  margin: 0;
}
 
.box {
  width: 60px;
  height: 60px;
  position: relative;
  overflow: hidden; /* если картинка вылезает — обрежем */
  border-radius: 10px; /* можно скруглить углы */
}
 
.box img {
  width: 100%;
  height: 100%;
  object-fit: cover;  
}

/* 1. Движение влево-вправо */
.move {
  animation: moveLeftRight 2s infinite alternate ease-in-out;
}
@keyframes moveLeftRight {
  from { left: 0; }
  to { left: 150px; }
}

/* 2. Прыжок вверх-вниз */
.jump {
  animation: jump 1.5s infinite ease-in-out;
}
@keyframes jump {
  0%, 100% { top: 0; }
  50% { top: -50px; }
}

/* 3. Вращение */
.rotate {
  animation: rotate 2s infinite linear;

  <canvas id="canvas" width="800" height="500"></canvas>

!script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const color = document.getElementById('color');
  const size = document.getElementById('size');
  const clearBtn = document.getElementById('clear');

  let drawing = false;

  canvas.addEventListener('mousedown', (e) => {
    drawing = true;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    ctx.beginPath();
    ctx.moveTo(x, y);
  });

  canvas.addEventListener('mouseup', () => drawing = false);
  canvas.addEventListener('mouseleave', () => drawing = false);

  canvas.addEventListener('mousemove', (e) => {
    if (!drawing) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    ctx.lineWidth = size.value;
    ctx.lineCap = 'round';
    ctx.strokeStyle = color.value;
    ctx.lineTo(x, y);
    ctx.stroke();
  });

  clearBtn.addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });
!/script>
